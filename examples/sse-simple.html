<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helium SSE — minimal example</title>
  <link rel="stylesheet" href="showcase.css">
  <script src="file-warning.js" defer></script>
</head>
<body>
  <main class="shell" data-helium>
    <article class="card full tint-lime" style="width: min(620px, 100%); margin: 12vh auto 0; text-align: center">
      <span class="feature-label">minimal SSE example</span>
      <h1 style="font-size: clamp(2.5rem, 10vw, 5rem); color: var(--ink)">Hello, stream.</h1>
      <p class="muted">One directive starts the request. One target receives each server event.</p>
      <button class="button" @get="/api/hello-world" @target="#message">Start</button>
      <div id="message" class="preview" style="display: grid; margin-top: 20px; place-items: center; font-size: 1.4rem">Ready.</div>
      <p class="code-line">@get="/api/hello-world" @target="#message"</p>
      <a href="sse-demo.html">See all SSE patterns →</a>
    </article>
  </main>
  <script type="module">import helium from "../helium-sse.js"; helium()</script>
</body>
</html>
